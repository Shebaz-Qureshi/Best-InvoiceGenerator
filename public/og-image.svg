<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Best Invoice Generator</title>
  <desc id="desc">A dark workspace showing a clear professional invoice.</desc>
  <rect width="1200" height="630" fill="#09090b"/>
  <rect x="56" y="50" width="1088" height="530" rx="24" fill="#18181b" stroke="#3f3f46"/>
  <rect x="96" y="93" width="220" height="40" rx="10" fill="#f4f4f5"/>
  <text x="116" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Best Invoice Generator</text>
  <text x="98" y="194" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#fafafa">Create invoices.</text>
  <text x="98" y="253" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#fafafa">Get paid.</text>
  <text x="98" y="302" font-family="Arial, sans-serif" font-size="20" fill="#a1a1aa">Free, private, and ready in minutes.</text>
  <rect x="608" y="91" width="476" height="448" rx="8" fill="#ffffff"/>
  <text x="646" y="148" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18181b">NORTHSTAR STUDIO</text>
  <text x="935" y="149" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#18181b">INVOICE</text>
  <text x="646" y="191" font-family="Arial, sans-serif" font-size="13" fill="#71717a">hello@northstar.studio</text>
  <text x="646" y="245" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#71717a">BILL TO</text>
  <text x="646" y="272" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#27272a">Acme Corporation</text>
  <line x1="646" y1="332" x2="1045" y2="332" stroke="#18181b"/>
  <text x="646" y="361" font-family="Arial, sans-serif" font-size="14" fill="#27272a">Product design retainer</text>
  <text x="990" y="361" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#27272a">$2,400.00</text>
  <line x1="646" y1="383" x2="1045" y2="383" stroke="#e4e4e7"/>
  <text x="646" y="412" font-family="Arial, sans-serif" font-size="14" fill="#27272a">Design system audit</text>
  <text x="1004" y="412" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#27272a">$800.00</text>
  <line x1="846" y1="458" x2="1045" y2="458" stroke="#18181b"/>
  <text x="846" y="489" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">Total due</text>
  <text x="958" y="489" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">$3,456.00</text>
