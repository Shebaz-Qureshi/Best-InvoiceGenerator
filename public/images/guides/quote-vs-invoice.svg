<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="qviBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="qviGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#qviBg)" />

  <g filter="url(#qviGlow)">
    <!-- Left Card: The Quote / Proposal -->
    <rect x="150" y="85" width="220" height="280" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 150 99 Q 150 85 164 85 L 356 85 Q 370 85 370 99 L 370 130 L 150 130 Z" fill="#1e293b" />
    <rect x="175" y="100" width="70" height="15" rx="4" fill="url(#quoteGrad)" />
    <circle cx="345" cy="107" r="8" fill="#38bdf8" opacity="0.5" />

    <rect x="175" y="150" width="100" height="8" rx="2" fill="#475569" />
    <rect x="305" y="150" width="40" height="8" rx="2" fill="#94a3b8" />
    <line x1="175" y1="170" x2="345" y2="170" stroke="#1e293b" stroke-width="1" />

    <rect x="175" y="185" width="120" height="8" rx="2" fill="#475569" />
    <rect x="305" y="185" width="40" height="8" rx="2" fill="#94a3b8" />
    <line x1="175" y1="205" x2="345" y2="205" stroke="#1e293b" stroke-width="1" />

    <rect x="175" y="225" width="170" height="40" rx="6" fill="#1e293b" />
    <rect x="190" y="241" width="90" height="8" rx="2" fill="#38bdf8" />

    <rect x="175" y="290" width="80" height="28" rx="6" fill="#334155" />

    <!-- Center Handoff / Transition Arrow -->
    <g transform="translate(385, 205)">
      <circle cx="15" cy="15" r="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <path d="M 5 15 L 23 15 M 16 8 L 23 15 L 16 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Right Card: The Invoice / Payment Request -->
    <rect x="430" y="85" width="220" height="280" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <path d="M 430 99 Q 430 85 444 85 L 636 85 Q 650 85 650 99 L 650 130 L 430 130 Z" fill="#1e293b" />
    <rect x="455" y="100" width="70" height="15" rx="4" fill="url(#invGrad)" />
    <circle cx="625" cy="107" r="8" fill="#10b981" />

    <rect x="455" y="150" width="100" height="8" rx="2" fill="#475569" />
    <rect x="585" y="150" width="40" height="8" rx="2" fill="#34d399" />
    <line x1="455" y1="170" x2="625" y2="170" stroke="#1e293b" stroke-width="1" />

    <rect x="455" y="185" width="120" height="8" rx="2" fill="#475569" />
    <rect x="585" y="185" width="40" height="8" rx="2" fill="#34d399" />
    <line x1="455" y1="205" x2="625" y2="205" stroke="#1e293b" stroke-width="1" />

    <rect x="455" y="225" width="170" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <rect x="470" y="241" width="90" height="8" rx="2" fill="#34d399" />

    <rect x="455" y="290" width="90" height="28" rx="6" fill="url(#invGrad)" />
  </g>
</svg>
