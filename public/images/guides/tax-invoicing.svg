<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="taxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="taxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#14b8a6" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#taxBg)" />
  
  <g filter="url(#taxGlow)">
    <rect x="250" y="70" width="300" height="310" rx="16" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5" />
    <path d="M 250 86 Q 250 70 266 70 L 534 70 Q 550 70 550 86 L 550 120 L 250 120 Z" fill="#1e293b" />
    
    <!-- Header indicators -->
    <rect x="280" y="88" width="80" height="14" rx="4" fill="url(#taxGrad)" />
    <rect x="470" y="88" width="50" height="14" rx="4" fill="#334155" />

    <!-- Ledger Rows -->
    <rect x="280" y="145" width="140" height="8" rx="2" fill="#475569" />
    <rect x="470" y="145" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="165" x2="520" y2="165" stroke="#1e293b" stroke-width="1" />

    <rect x="280" y="180" width="160" height="8" rx="2" fill="#475569" />
    <rect x="470" y="180" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="200" x2="520" y2="200" stroke="#1e293b" stroke-width="1" />

    <rect x="280" y="215" width="120" height="8" rx="2" fill="#475569" />
    <rect x="470" y="215" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="235" x2="520" y2="235" stroke="#1e293b" stroke-width="1" />

    <!-- Tax rate calculation badge -->
    <rect x="280" y="255" width="240" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="305" cy="275" r="10" fill="url(#taxGrad)" />
    <rect x="330" y="271" width="110" height="8" rx="2" fill="#cbd5e1" />
    <rect x="470" y="271" width="35" height="8" rx="2" fill="#14b8a6" />

    <!-- Total box -->
    <rect x="390" y="315" width="130" height="36" rx="8" fill="url(#taxGrad)" opacity="0.9" />
  </g>
</svg>
