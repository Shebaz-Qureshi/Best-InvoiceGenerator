<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="recGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#ec4899" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#recBg)" />

  <g filter="url(#recGlow)">
    <!-- Recurring Cycle Card -->
    <rect x="240" y="70" width="320" height="310" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />

    <!-- Circular Repeat Arrow Graphic -->
    <circle cx="400" cy="130" r="34" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 4" />
    <path d="M 400 96 A 34 34 0 0 1 434 130" fill="none" stroke="url(#recGrad)" stroke-width="4" stroke-linecap="round" />
    <polygon points="434,130 426,122 442,122" fill="#ec4899" />
    <circle cx="400" cy="130" r="14" fill="#1e293b" />

    <!-- Monthly Billing Cycle Rows -->
    <rect x="270" y="185" width="260" height="36" rx="8" fill="#1e293b" />
    <circle cx="290" cy="203" r="8" fill="#10b981" />
    <rect x="310" y="199" width="110" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="199" width="40" height="8" rx="2" fill="#ec4899" />

    <rect x="270" y="230" width="260" height="36" rx="8" fill="#1e293b" />
    <circle cx="290" cy="248" r="8" fill="#10b981" />
    <rect x="310" y="244" width="130" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="244" width="40" height="8" rx="2" fill="#ec4899" />

    <rect x="270" y="275" width="260" height="36" rx="8" fill="#1e293b" />
    <circle cx="290" cy="293" r="8" fill="#3b82f6" />
    <rect x="310" y="289" width="90" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="289" width="40" height="8" rx="2" fill="#ec4899" />

    <!-- Auto-renewal Badge -->
    <rect x="380" y="325" width="150" height="36" rx="8" fill="url(#recGrad)" />
  </g>
</svg>
