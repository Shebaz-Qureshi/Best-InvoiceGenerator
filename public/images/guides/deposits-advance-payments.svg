<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 120)">
    <!-- Stage 1: Deposit Invoice -->
    <rect x="50" y="40" width="300" height="280" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="80" y="65" width="160" height="28" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="160" y="84" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DEPOSIT INVOICE (40%)</text>
    <text x="200" y="140" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="700" text-anchor="middle">$2,000.00</text>
    <text x="200" y="175" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Payable before work begins</text>
    <rect x="110" y="220" width="180" height="36" rx="18" fill="#064e3b" stroke="#34d399"/>
    <text x="200" y="243" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">FUNDS RECEIVED ✓</text>

    <!-- Arrow -->
    <path d="M380 180 L460 180 M445 170 L460 180 L445 190" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 2: Final Invoice -->
    <rect x="490" y="40" width="300" height="280" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="520" y="65" width="160" height="28" rx="8" fill="#1e293b" stroke="#3b82f6"/>
    <text x="600" y="84" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">FINAL INVOICE</text>
    <text x="640" y="130" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Project Total: $5,000</text>
    <text x="640" y="155" fill="#34d399" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Less Deposit Paid: -$2,000</text>
    <line x1="530" y1="180" x2="750" y2="180" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="640" y="215" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">BALANCE DUE: $3,000</text>
  </g>

</svg>