<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <!-- Threat side -->
    <rect x="40" y="50" width="340" height="280" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="70" y="80" width="280" height="32" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="210" y="101" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SUSPICIOUS EMAIL RECEIVED</text>
    <text x="210" y="150" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">"Our bank details have changed..."</text>
    <text x="210" y="180" fill="#71717a" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Lookalike domain / spoofed sender</text>
    <rect x="110" y="220" width="200" height="40" rx="20" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="245" fill="#ef4444" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DO NOT PAY YET</text>

    <!-- Security Check Shield -->
    <g transform="translate(480, 50)">
      <rect width="340" height="280" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
      <rect x="30" y="80" width="280" height="32" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="170" y="101" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">VERIFICATION CONTROL</text>
      <text x="170" y="150" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1. Out-of-band phone call</text>
      <text x="170" y="180" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2. Use known number on file</text>
      <rect x="70" y="220" width="200" height="40" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <text x="170" y="245" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CONFIRMED SAFE</text>
    </g>
  </g>

</svg>