<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#ptBg)" />

  <g filter="url(#ptGlow)">
    <!-- Calendar & Terms Grid Mockup -->
    <rect x="250" y="70" width="300" height="310" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Calendar Header Bar with Ring Bindings -->
    <path d="M 250 86 Q 250 70 266 70 L 534 70 Q 550 70 550 86 L 550 125 L 250 125 Z" fill="url(#ptGrad)" />
    
    <rect x="300" y="60" width="12" height="20" rx="4" fill="#1e293b" />
    <rect x="394" y="60" width="12" height="20" rx="4" fill="#1e293b" />
    <rect x="488" y="60" width="12" height="20" rx="4" fill="#1e293b" />

    <rect x="330" y="90" width="140" height="14" rx="4" fill="#ffffff" opacity="0.9" />

    <!-- Calendar Grid Mini Blocks -->
    <g fill="#1e293b">
      <rect x="280" y="145" width="36" height="32" rx="6" />
      <rect x="328" y="145" width="36" height="32" rx="6" />
      <rect x="376" y="145" width="36" height="32" rx="6" />
      <rect x="424" y="145" width="36" height="32" rx="6" />
      <rect x="472" y="145" width="36" height="32" rx="6" />

      <rect x="280" y="187" width="36" height="32" rx="6" />
      <rect x="328" y="187" width="36" height="32" rx="6" />
      <!-- Selected Due Date Highlight -->
      <rect x="376" y="187" width="36" height="32" rx="6" fill="#3b82f6" />
      <circle cx="394" cy="203" r="6" fill="#ffffff" />
      <rect x="424" y="187" width="36" height="32" rx="6" />
      <rect x="472" y="187" width="36" height="32" rx="6" />
    </g>

    <!-- Payment Terms Summary Strip -->
    <rect x="280" y="240" width="240" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="305" cy="270" r="12" fill="#22c55e" />
    <path d="M 300 270 L 303 273 L 310 266" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="330" y="260" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="330" y="274" width="70" height="8" rx="2" fill="#94a3b8" />
    <rect x="450" y="260" width="55" height="20" rx="4" fill="#3b82f6" opacity="0.3" stroke="#60a5fa" stroke-width="1" />

    <!-- Action Button -->
    <rect x="390" y="325" width="130" height="36" rx="8" fill="url(#ptGrad)" />
  </g>
</svg>
