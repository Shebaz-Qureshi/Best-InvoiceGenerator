<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 100)">
    <!-- PDF side -->
    <rect x="40" y="60" width="240" height="300" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="70" y="95" width="80" height="24" rx="6" fill="#450a0a" stroke="#ef4444"/>
    <text x="110" y="112" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PDF</text>
    <text x="160" y="170" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Human readable</text>
    <text x="160" y="200" fill="#71717a" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Unstructured pixels</text>
    <circle cx="160" cy="270" r="26" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <path d="M150 260 L170 280 M170 260 L150 280" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Arrow -->
    <path d="M340 210 L440 210 M420 195 L440 210 L420 225" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="190" fill="#10b981" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PEPPOL / UBL</text>

    <!-- XML / Structured side -->
    <rect x="520" y="60" width="280" height="300" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="550" y="95" width="120" height="24" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="610" y="112" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">XML / FACTUR-X</text>
    <text x="660" y="165" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">&lt;Invoice xmlns="..."&gt;</text>
    <text x="660" y="195" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">&lt;LegalMonetaryTotal&gt;</text>
    <circle cx="660" cy="270" r="26" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <path d="M150 260 L170 280 M170 260 L150 280" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M650 270 L658 278 L672 264" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>