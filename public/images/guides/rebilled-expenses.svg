<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <rect x="40" y="40" width="760" height="300" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <g transform="translate(80, 70)">
      <rect width="300" height="230" rx="10" fill="#18181b" stroke="#3b82f6"/>
      <rect x="20" y="20" width="160" height="26" rx="6" fill="#1e293b"/>
      <text x="100" y="38" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">REBILLED EXPENSE</text>
      <text x="25" y="85" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Hotel accommodation</text>
      <text x="25" y="115" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Travel / Train tickets</text>
      <text x="25" y="145" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Incurred in your name</text>
      <text x="25" y="195" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="600">Standard tax treatment applies</text>
    </g>

    <g transform="translate(420, 70)">
      <rect width="340" height="230" rx="10" fill="#18181b" stroke="#10b981"/>
      <rect x="20" y="20" width="180" height="26" rx="6" fill="#064e3b"/>
      <text x="110" y="38" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DISBURSEMENT (PASS-THROUGH)</text>
      <text x="25" y="85" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Official filing / registry fees</text>
      <text x="25" y="115" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Paid on client's direct behalf</text>
      <text x="25" y="145" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Exact cost, zero markup</text>
      <text x="25" y="195" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600">Excluded from taxable turnover</text>
    </g>
  </g>

</svg>