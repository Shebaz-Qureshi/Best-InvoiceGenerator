<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="odBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="odG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#odBg)" />

  <g filter="url(#glow6)">
    <!-- Calendar/Clock Grid Shield Mockup -->
    <rect x="240" y="80" width="320" height="290" rx="16" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    <rect x="270" y="110" width="260" height="40" rx="8" fill="#1e293b" />
    <circle cx="295" cy="130" r="10" fill="url(#odG)" />
    <rect x="315" y="125" width="120" height="10" rx="3" fill="#e2e8f0" />

    <!-- Timeline Nodes -->
    <circle cx="280" cy="190" r="12" fill="#22c55e" />
    <rect x="305" y="186" width="180" height="8" rx="2" fill="#475569" />

    <line x1="280" y1="202" x2="280" y2="238" stroke="#334155" stroke-width="2" stroke-dasharray="2 2" />

    <circle cx="280" cy="250" r="12" fill="#f59e0b" />
    <rect x="305" y="246" width="210" height="8" rx="2" fill="#cbd5e1" />

    <line x1="280" y1="262" x2="280" y2="298" stroke="#334155" stroke-width="2" stroke-dasharray="2 2" />

    <circle cx="280" cy="310" r="12" fill="#ef4444" />
    <rect x="305" y="306" width="160" height="8" rx="2" fill="#f87171" />
  </g>
</svg>
