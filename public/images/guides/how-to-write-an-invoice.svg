<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wrtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="wrtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="wrtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#wrtBg)" />

  <g filter="url(#wrtGlow)">
    <!-- Invoice Writing Document -->
    <rect x="250" y="65" width="300" height="320" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 250 81 Q 250 65 266 65 L 534 65 Q 550 65 550 81 L 550 115 L 250 115 Z" fill="#1e293b" />

    <!-- Pen Icon Badge -->
    <rect x="280" y="82" width="20" height="20" rx="4" fill="url(#wrtGrad)" />
    <path d="M 284 92 L 296 80" stroke="#fff" stroke-width="2" stroke-linecap="round" />
    <path d="M 286 90 L 294 82" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="310" y="87" width="100" height="10" rx="3" fill="#e2e8f0" />
    <rect x="470" y="87" width="50" height="10" rx="3" fill="#334155" />

    <!-- Step 1: Identity -->
    <rect x="280" y="140" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="157" r="9" fill="url(#wrtGrad)" />
    <text x="298" y="161" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <rect x="316" y="153" width="130" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="153" width="35" height="8" rx="2" fill="#3b82f6" />

    <!-- Step 2: Number & Date -->
    <rect x="280" y="184" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="201" r="9" fill="url(#wrtGrad)" />
    <text x="298" y="205" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <rect x="316" y="197" width="110" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="197" width="35" height="8" rx="2" fill="#3b82f6" />

    <!-- Step 3: Line Items -->
    <rect x="280" y="228" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="245" r="9" fill="url(#wrtGrad)" />
    <text x="298" y="249" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <rect x="316" y="241" width="120" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="241" width="35" height="8" rx="2" fill="#3b82f6" />

    <!-- Step 4: Tax & Total -->
    <rect x="280" y="272" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="289" r="9" fill="url(#wrtGrad)" />
    <text x="298" y="293" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <rect x="316" y="285" width="90" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="285" width="35" height="8" rx="2" fill="#3b82f6" />

    <!-- Step 5: Payment Terms -->
    <rect x="280" y="316" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="333" r="9" fill="url(#wrtGrad)" />
    <text x="298" y="337" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <rect x="316" y="329" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="329" width="35" height="8" rx="2" fill="#3b82f6" />

    <!-- Create Invoice Button -->
    <rect x="390" y="365" width="130" height="36" rx="8" fill="url(#wrtGrad)" />
    <text x="455" y="388" font-size="12" font-weight="600" fill="#000" text-anchor="middle">Write Invoice</text>
  </g>
</svg>