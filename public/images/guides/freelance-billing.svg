  <g filter="url(#shadow)">
    <rect x="220" y="65" width="360" height="320" rx="16" fill="url(#cardG1)" stroke="#334155" stroke-width="1.5" />
    <path d="M 220 81 Q 220 65 236 65 L 564 65 Q 580 65 580 81 L 580 95 L 220 95 Z" fill="#1e293b" />
    <rect x="245" y="77" width="14" height="14" rx="7" fill="#ef4444" opacity="0.8" />
    <rect x="267" y="77" width="14" height="14" rx="7" fill="#f59e0b" opacity="0.8" />
    <rect x="289" y="77" width="14" height="14" rx="7" fill="#10b981" opacity="0.8" />
    
    <!-- Top banner accent -->
    <rect x="245" y="115" width="120" height="16" rx="4" fill="url(#accG1)" />
    <rect x="475" y="115" width="80" height="12" rx="3" fill="#475569" />
    
    <!-- Lines & tables -->
    <rect x="245" y="150" width="150" height="8" rx="2" fill="#334155" />
    <rect x="245" y="166" width="100" height="8" rx="2" fill="#1e293b" />
