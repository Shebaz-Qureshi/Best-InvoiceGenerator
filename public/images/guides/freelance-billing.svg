    <!-- Table header -->
    <rect x="245" y="195" width="310" height="24" rx="4" fill="#334155" opacity="0.4" />
    
    <!-- Table rows -->
    <rect x="245" y="230" width="160" height="8" rx="2" fill="#475569" />
    <rect x="505" y="230" width="50" height="8" rx="2" fill="#38bdf8" />
    <line x1="245" y1="248" x2="555" y2="248" stroke="#1e293b" stroke-width="1" />

    <rect x="245" y="260" width="140" height="8" rx="2" fill="#475569" />
    <rect x="505" y="260" width="50" height="8" rx="2" fill="#38bdf8" />
    <line x1="245" y1="278" x2="555" y2="278" stroke="#1e293b" stroke-width="1" />

    <!-- Total section -->
    <rect x="415" y="300" width="140" height="32" rx="6" fill="url(#accG2)" opacity="0.2" stroke="#10b981" stroke-width="1" />
    <rect x="430" y="312" width="110" height="8" rx="2" fill="#34d399" />
