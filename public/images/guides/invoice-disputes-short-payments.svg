<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <rect x="40" y="50" width="320" height="280" rx="14" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="2"/>
    <text x="200" y="90" fill="#f43f5e" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ORIGINAL INVOICE $5,000</text>
    <rect x="70" y="120" width="260" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="200" y="145" fill="#34d399" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Undisputed portion: $4,200 (Paid)</text>
    <rect x="70" y="180" width="260" height="40" rx="8" fill="#4c0519" stroke="#f43f5e"/>
    <text x="200" y="205" fill="#fda4af" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Disputed line item: $800</text>

    <!-- Arrow -->
    <path d="M390 190 L460 190 M445 180 L460 190 L445 200" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Resolution side -->
    <rect x="480" y="50" width="320" height="280" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2"/>
    <text x="640" y="90" fill="#f472b6" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">RESOLUTION</text>
    <rect x="510" y="120" width="260" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="640" y="145" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1. Review scope & agreement</text>
    <rect x="510" y="180" width="260" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="640" y="205" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2. Issue Credit Note for diff</text>
    <rect x="510" y="240" width="260" height="40" rx="8" fill="#18181b" stroke="#10b981"/>
    <text x="640" y="265" fill="#34d399" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">3. Account balance: Clean 0</text>
  </g>

</svg>