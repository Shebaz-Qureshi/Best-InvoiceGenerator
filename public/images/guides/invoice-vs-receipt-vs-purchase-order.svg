<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <!-- Documents Timeline -->
  <g transform="translate(100, 150)">
    <!-- Connecting Line -->
    <line x1="120" y1="150" x2="880" y2="150" stroke="#27272a" stroke-width="4" stroke-dasharray="8 8"/>
    
    <!-- Step 1: PO -->
    <g transform="translate(40, 40)">
      <rect width="160" height="220" rx="12" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="2"/>
      <rect x="20" y="24" width="120" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="80" y="40" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PURCHASE ORDER</text>
      <rect x="20" y="68" width="120" height="8" rx="4" fill="#3f3f46"/>
      <rect x="20" y="88" width="90" height="8" rx="4" fill="#27272a"/>
      <rect x="20" y="108" width="110" height="8" rx="4" fill="#27272a"/>
      <circle cx="80" cy="165" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="80" y="171" fill="#60a5fa" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="80" y="250" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Buyer Commits</text>
    </g>

    <!-- Step 2: Invoice -->
    <g transform="translate(420, 40)">
      <rect width="160" height="220" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2"/>
      <rect x="20" y="24" width="120" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="80" y="40" fill="#818cf8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TAX INVOICE</text>
      <rect x="20" y="68" width="120" height="8" rx="4" fill="#4f46e5"/>
      <rect x="20" y="88" width="100" height="8" rx="4" fill="#27272a"/>
      <rect x="20" y="108" width="80" height="8" rx="4" fill="#27272a"/>
      <circle cx="80" cy="165" r="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <text x="80" y="171" fill="#818cf8" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="80" y="250" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Seller Requests</text>
    </g>

    <!-- Step 3: Receipt -->
    <g transform="translate(800, 40)">
      <rect width="160" height="220" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="2"/>
      <rect x="20" y="24" width="120" height="24" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <text x="80" y="40" fill="#4ade80" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PAYMENT RECEIPT</text>
      <rect x="20" y="68" width="120" height="8" rx="4" fill="#22c55e"/>
      <rect x="20" y="88" width="90" height="8" rx="4" fill="#27272a"/>
      <rect x="20" y="108" width="110" height="8" rx="4" fill="#27272a"/>
      <circle cx="80" cy="165" r="22" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
      <text x="80" y="171" fill="#4ade80" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="80" y="250" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Payment Confirmed</text>
    </g>
  </g>

</svg>