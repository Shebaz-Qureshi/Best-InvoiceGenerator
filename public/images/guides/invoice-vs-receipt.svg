<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ivrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ivrGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="ivrGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="ivrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#ef4444" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#ivrBg)" />

  <g filter="url(#ivrGlow)">
    <!-- Left: Invoice Document (Red) -->
    <rect x="150" y="65" width="240" height="320" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <path d="M 150 81 Q 150 65 166 65 L 374 65 Q 390 65 390 81 L 390 115 L 150 115 Z" fill="#1e293b" />

    <!-- Invoice Badge -->
    <rect x="170" y="82" width="20" height="20" rx="4" fill="url(#ivrGrad1)" />
    <text x="176" y="96" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">INV</text>
    <rect x="196" y="87" width="100" height="10" rx="3" fill="#e2e8f0" />
    <rect x="310" y="87" width="40" height="10" rx="3" fill="#334155" />

    <!-- Invoice Items -->
    <rect x="170" y="140" width="180" height="34" rx="6" fill="#1e293b" />
    <rect x="188" y="153" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="310" y="153" width="35" height="8" rx="2" fill="#ef4444" />

    <rect x="170" y="184" width="180" height="34" rx="6" fill="#1e293b" />
    <rect x="188" y="197" width="80" height="8" rx="2" fill="#e2e8f0" />
    <rect x="310" y="197" width="35" height="8" rx="2" fill="#ef4444" />

    <rect x="170" y="228" width="180" height="34" rx="6" fill="#1e293b" />
    <rect x="188" y="241" width="110" height="8" rx="2" fill="#e2e8f0" />
    <rect x="310" y="241" width="35" height="8" rx="2" fill="#ef4444" />

    <!-- Total Due -->
    <rect x="170" y="272" width="180" height="34" rx="6" fill="#1e293b" />
    <text x="260" y="290" font-size="11" fill="#ef4444" text-anchor="middle">Total Due</text>
    <text x="260" y="304" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">$1,500.00</text>

    <!-- Right: Receipt Document (Green) -->
    <rect x="410" y="65" width="240" height="320" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <path d="M 410 81 Q 410 65 426 65 L 634 65 Q 650 65 650 81 L 650 115 L 410 115 Z" fill="#1e293b" />

    <!-- Receipt Badge -->
    <rect x="430" y="82" width="20" height="20" rx="4" fill="url(#ivrGrad2)" />
    <text x="436" y="96" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">RCPT</text>
    <rect x="456" y="87" width="100" height="10" rx="3" fill="#e2e8f0" />
    <rect x="570" y="87" width="40" height="10" rx="3" fill="#334155" />

    <!-- Receipt Items -->
    <rect x="430" y="140" width="180" height="34" rx="6" fill="#1e293b" />
    <rect x="448" y="153" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="570" y="153" width="35" height="8" rx="2" fill="#10b981" />

    <rect x="430" y="184" width="180" height="34" rx="6" fill="#1e293b" />
    <rect x="448" y="197" width="80" height="8" rx="2" fill="#e2e8f0" />
    <rect x="570" y="197" width="35" height="8" rx="2" fill="#10b981" />

    <!-- Paid Stamp -->
    <rect x="430" y="228" width="180" height="54" rx="6" fill="#1e293b" />
    <circle cx="520" cy="255" r="20" fill="url(#ivrGrad2)" />
    <path d="M 510 255 L 516 261 L 530 245" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="520" y="290" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">PAID</text>

    <!-- Arrow Between -->
    <path d="M 390 225 L 410 225" stroke="#52525b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#52525b" />
      </marker>
    </defs>
    <text x="400" y="220" font-size="11" fill="#52525b" text-anchor="middle">before</text>
    <text x="400" y="212" font-size="11" fill="#52525b" text-anchor="middle">payment</text>
    <text x="400" y="240" font-size="11" fill="#52525b" text-anchor="middle">after</text>
    <text x="400" y="248" font-size="11" fill="#52525b" text-anchor="middle">payment</text>
  </g>
</svg>