<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="crGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0ea5e9" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#crBg)" />

  <g filter="url(#crGlow)">
    <!-- Time Tracker & Retainer Card -->
    <rect x="250" y="70" width="300" height="310" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    
    <!-- Top Clock / Meter Graphic -->
    <circle cx="400" cy="130" r="36" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 400 130 L 400 106 M 400 130 L 418 130" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="400" cy="130" r="4" fill="#0ea5e9" />

    <!-- Hourly Log Breakdown -->
    <rect x="280" y="185" width="240" height="35" rx="6" fill="#1e293b" />
    <rect x="295" y="198" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="198" width="35" height="8" rx="2" fill="#38bdf8" />

    <rect x="280" y="230" width="240" height="35" rx="6" fill="#1e293b" />
    <rect x="295" y="243" width="120" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="243" width="35" height="8" rx="2" fill="#38bdf8" />

    <rect x="280" y="275" width="240" height="35" rx="6" fill="#1e293b" />
    <rect x="295" y="288" width="80" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="288" width="35" height="8" rx="2" fill="#38bdf8" />

    <!-- Retainer Summary -->
    <rect x="390" y="325" width="130" height="36" rx="8" fill="url(#crGrad)" />
  </g>
</svg>
