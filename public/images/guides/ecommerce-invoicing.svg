<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ecGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="ecGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#ecBg)" />

  <g filter="url(#ecGlow)">
    <!-- Main Invoice / Packing Slip Mockup -->
    <rect x="250" y="70" width="300" height="310" rx="16" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
    
    <!-- Top Bar with Box/Package Icon -->
    <path d="M 250 86 Q 250 70 266 70 L 534 70 Q 550 70 550 86 L 550 120 L 250 120 Z" fill="#1e293b" />
    
    <rect x="280" y="85" width="24" height="24" rx="4" fill="url(#ecGrad)" />
    <polygon points="292,88 284,93 292,98 300,93" fill="#ffffff" opacity="0.9" />
    <polygon points="284,95 292,100 292,107 284,102" fill="#ffffff" opacity="0.7" />
    <polygon points="300,95 292,100 292,107 300,102" fill="#ffffff" opacity="0.8" />
    
    <rect x="315" y="92" width="100" height="10" rx="3" fill="#e2e8f0" />
    <rect x="470" y="92" width="50" height="10" rx="3" fill="#475569" />

    <!-- Product SKU Line Items -->
    <rect x="280" y="145" width="150" height="8" rx="2" fill="#475569" />
    <rect x="470" y="145" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="165" x2="520" y2="165" stroke="#1e293b" stroke-width="1" />

    <rect x="280" y="180" width="130" height="8" rx="2" fill="#475569" />
    <rect x="470" y="180" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="200" x2="520" y2="200" stroke="#1e293b" stroke-width="1" />

    <rect x="280" y="215" width="140" height="8" rx="2" fill="#475569" />
    <rect x="470" y="215" width="50" height="8" rx="2" fill="#94a3b8" />
    <line x1="280" y1="235" x2="520" y2="235" stroke="#1e293b" stroke-width="1" />

    <!-- Shipping & Discount Badges -->
    <rect x="280" y="255" width="240" height="40" rx="8" fill="#1e293b" />
    <circle cx="305" cy="275" r="8" fill="#10b981" />
    <rect x="325" y="271" width="80" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="271" width="35" height="8" rx="2" fill="#f97316" />

    <rect x="390" y="315" width="130" height="36" rx="8" fill="url(#ecGrad)" />
  </g>
</svg>
