<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <rect x="40" y="40" width="760" height="300" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    
    <rect x="80" y="70" width="260" height="32" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <text x="210" y="91" fill="#fcd34d" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ON-SITE TRADES INVOICE</text>

    <!-- Three blocks: Callout, Labour, Parts -->
    <g transform="translate(80, 130)">
      <rect width="190" height="150" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="95" y="35" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Callout / Diagnostic</text>
      <text x="95" y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">$120.00</text>
      <text x="95" y="110" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">First hour fixed rate</text>
    </g>

    <g transform="translate(295, 130)">
      <rect width="190" height="150" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="95" y="35" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Labour Hours</text>
      <text x="95" y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">$270.00</text>
      <text x="95" y="110" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">3 hrs @ $90/hr</text>
    </g>

    <g transform="translate(510, 130)">
      <rect width="250" height="150" rx="10" fill="#18181b" stroke="#10b981"/>
      <text x="125" y="35" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Materials & Sign-off</text>
      <text x="125" y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">$185.00</text>
      <text x="125" y="110" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">On-site client signature ✓</text>
    </g>
  </g>

</svg>