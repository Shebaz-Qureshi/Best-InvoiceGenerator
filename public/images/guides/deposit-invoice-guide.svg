<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="depBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="depGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="depGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#depBg)" />

  <g filter="url(#depGlow)">
    <!-- Deposit Invoice Document -->
    <rect x="250" y="65" width="300" height="320" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 250 81 Q 250 65 266 65 L 534 65 Q 550 65 550 81 L 550 115 L 250 115 Z" fill="#1e293b" />

    <!-- Deposit Badge -->
    <rect x="280" y="82" width="20" height="20" rx="4" fill="url(#depGrad)" />
    <text x="286" y="96" font-size="10" font-weight="bold" fill="#000">50%</text>
    <rect x="310" y="87" width="120" height="10" rx="3" fill="#e2e8f0" />
    <rect x="470" y="87" width="50" height="10" rx="3" fill="#334155" />

    <!-- Invoice Line Items -->
    <rect x="280" y="140" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="157" r="9" fill="url(#depGrad)" />
    <path d="M 294 157 L 297 160 L 303 153" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="316" y="153" width="140" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="153" width="35" height="8" rx="2" fill="#f59e0b" />

    <rect x="280" y="184" width="240" height="34" rx="6" fill="#1e293b" />
    <circle cx="298" cy="201" r="9" fill="url(#depGrad)" />
    <path d="M 294 201 L 297 204 L 303 197" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="316" y="197" width="120" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="197" width="35" height="8" rx="2" fill="#f59e0b" />

    <rect x="280" y="228" width="240" height="34" rx="6" fill="#1e293b" />
    <text x="298" y="245" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">50%</text>
    <rect x="316" y="241" width="100" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="241" width="35" height="8" rx="2" fill="#f59e0b" />

    <!-- Balance Note -->
    <rect x="280" y="272" width="240" height="44" rx="6" fill="#1e293b" />
    <text x="400" y="290" font-size="10" fill="#9ca3af" text-anchor="middle">Remaining Balance</text>
    <text x="400" y="306" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">$2,100.00</text>

    <!-- Pay Deposit Button -->
    <rect x="390" y="325" width="130" height="36" rx="8" fill="url(#depGrad)" />
    <text x="455" y="348" font-size="12" font-weight="600" fill="#000" text-anchor="middle">Pay Deposit</text>
  </g>
</svg>