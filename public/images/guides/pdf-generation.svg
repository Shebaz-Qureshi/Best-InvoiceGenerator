<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="pdfG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#pdfBg)" />

  <g filter="url(#glow8)">
    <rect x="270" y="65" width="260" height="320" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    
    <!-- PDF Document Badge -->
    <rect x="300" y="95" width="60" height="24" rx="6" fill="url(#pdfG)" />
    <rect x="380" y="102" width="120" height="10" rx="3" fill="#94a3b8" />

    <rect x="300" y="140" width="200" height="8" rx="2" fill="#334155" />
    <rect x="300" y="156" width="160" height="8" rx="2" fill="#1e293b" />

    <rect x="300" y="185" width="200" height="90" rx="8" fill="#1e293b" />
    <line x1="300" y1="215" x2="500" y2="215" stroke="#334155" stroke-width="1" />
    <line x1="300" y1="245" x2="500" y2="245" stroke="#334155" stroke-width="1" />

    <!-- Export Checkmark Ribbon -->
    <circle cx="400" cy="320" r="22" fill="url(#pdfG)" />
    <path d="M 390 320 L 397 327 L 412 312" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
