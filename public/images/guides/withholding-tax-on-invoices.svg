<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <rect x="40" y="40" width="760" height="300" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    
    <g transform="translate(80, 70)">
      <rect width="320" height="230" rx="10" fill="#18181b" stroke="#3f3f46"/>
      <text x="160" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">INVOICE TOTAL: $10,000</text>
      <line x1="30" y1="65" x2="290" y2="65" stroke="#27272a"/>
      <text x="30" y="105" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="14">Gross invoiced amount</text>
      <text x="290" y="105" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="14" text-anchor="end">$10,000</text>
      <text x="30" y="145" fill="#f87171" font-family="Inter, sans-serif" font-size="14">Less Withholding Tax (10%)</text>
      <text x="290" y="145" fill="#f87171" font-family="Inter, sans-serif" font-size="14" text-anchor="end">-$1,000</text>
      <line x1="30" y1="170" x2="290" y2="170" stroke="#3f3f46"/>
      <text x="30" y="200" fill="#34d399" font-family="Inter, sans-serif" font-size="15" font-weight="700">Net Cash Paid</text>
      <text x="290" y="200" fill="#34d399" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="end">$9,000</text>
    </g>

    <!-- Certificate Card -->
    <g transform="translate(440, 70)">
      <rect width="320" height="230" rx="10" fill="#18181b" stroke="#10b981"/>
      <rect x="25" y="25" width="220" height="28" rx="6" fill="#064e3b"/>
      <text x="135" y="44" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WITHHOLDING CERTIFICATE</text>
      <text x="30" y="95" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Formally issued by client</text>
      <text x="30" y="125" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Remitted directly to tax office</text>
      <text x="30" y="155" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">• Offsets your annual tax bill</text>
      <rect x="30" y="180" width="260" height="32" rx="16" fill="#064e3b" stroke="#10b981"/>
      <text x="160" y="201" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TAX CREDIT PRESERVED ✓</text>
    </g>
  </g>

</svg>