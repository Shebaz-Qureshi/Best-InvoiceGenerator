<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="phoneG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#mobBg)" />

  <!-- Smartphone Mockup -->
  <g filter="url(#glow4)">
    <rect x="310" y="50" width="180" height="350" rx="32" fill="#09090b" stroke="#334155" stroke-width="4" />
    <rect x="316" y="56" width="168" height="338" rx="26" fill="#0f172a" />
    <rect x="370" y="65" width="60" height="12" rx="6" fill="#1e293b" />
    
    <!-- Phone App UI -->
    <rect x="330" y="95" width="140" height="24" rx="6" fill="url(#phoneG)" />
    <rect x="330" y="130" width="140" height="60" rx="8" fill="#1e293b" />
    <rect x="345" y="145" width="70" height="8" rx="2" fill="#94a3b8" />
    <rect x="345" y="160" width="110" height="12" rx="3" fill="#60a5fa" />

    <rect x="330" y="200" width="140" height="40" rx="6" fill="#1e293b" />
    <rect x="330" y="250" width="140" height="40" rx="6" fill="#1e293b" />
    <rect x="330" y="300" width="140" height="36" rx="8" fill="#22c55e" opacity="0.9" />

    <!-- Home Indicator -->
    <rect x="370" y="380" width="60" height="4" rx="2" fill="#475569" />
  </g>
</svg>
