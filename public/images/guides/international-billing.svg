<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="intBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="intG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#intBg)" />

  <g filter="url(#glow7)">
    <!-- Globe Wireframe / Network Nodes -->
    <circle cx="400" cy="225" r="140" fill="none" stroke="#1e293b" stroke-width="2" />
    <ellipse cx="400" cy="225" rx="140" ry="60" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <ellipse cx="400" cy="225" rx="60" ry="140" fill="none" stroke="#1e293b" stroke-width="1.5" />

    <!-- Currency Cards Floating -->
    <rect x="230" y="120" width="140" height="80" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="260" cy="160" r="16" fill="url(#intG)" />
    <rect x="290" y="155" width="60" height="10" rx="3" fill="#e2e8f0" />

    <rect x="430" y="250" width="140" height="80" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="460" cy="290" r="16" fill="#38bdf8" />
    <rect x="490" y="285" width="60" height="10" rx="3" fill="#e2e8f0" />

    <circle cx="500" cy="140" r="8" fill="#10b981" />
    <circle cx="300" cy="300" r="8" fill="#38bdf8" />
  </g>
</svg>
