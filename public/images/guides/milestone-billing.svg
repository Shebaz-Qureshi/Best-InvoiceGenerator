<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="msGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#msBg)" />

  <g filter="url(#msGlow)">
    <rect x="230" y="80" width="340" height="290" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    
    <!-- Milestone Progress Track -->
    <rect x="265" y="120" width="270" height="12" rx="6" fill="#1e293b" />
    <rect x="265" y="120" width="180" height="12" rx="6" fill="url(#msGrad)" />
    
    <!-- Milestone Nodes -->
    <circle cx="265" cy="126" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="3" />
    <circle cx="355" cy="126" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="3" />
    <circle cx="445" cy="126" r="12" fill="#6366f1" stroke="#0f172a" stroke-width="3" />
    <circle cx="535" cy="126" r="12" fill="#334155" stroke="#0f172a" stroke-width="3" />

    <!-- Phase Cards -->
    <rect x="265" y="160" width="270" height="45" rx="8" fill="#1e293b" />
    <rect x="280" y="175" width="120" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="175" width="50" height="8" rx="2" fill="#8b5cf6" />
    <circle cx="450" cy="179" r="6" fill="#10b981" />

    <rect x="265" y="215" width="270" height="45" rx="8" fill="#1e293b" />
    <rect x="280" y="230" width="140" height="8" rx="2" fill="#e2e8f0" />
    <rect x="470" y="230" width="50" height="8" rx="2" fill="#8b5cf6" />
    <circle cx="450" cy="234" r="6" fill="#10b981" />

    <rect x="265" y="270" width="270" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="280" y="285" width="100" height="8" rx="2" fill="#94a3b8" />
    <rect x="470" y="285" width="50" height="8" rx="2" fill="#94a3b8" />
    <circle cx="450" cy="289" r="6" fill="#f59e0b" />

    <rect x="410" y="325" width="125" height="30" rx="6" fill="url(#msGrad)" />
  </g>
</svg>
