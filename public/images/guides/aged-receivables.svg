<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(120, 120)">
    <!-- Aging Buckets -->
    <g transform="translate(40, 40)">
      <rect width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
      <rect x="20" y="24" width="140" height="28" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="90" y="43" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CURRENT (0–30)</text>
      <text x="90" y="110" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$14,250</text>
      <text x="90" y="140" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">6 Invoices</text>
      <rect x="30" y="180" width="120" height="24" rx="12" fill="#064e3b"/>
      <text x="90" y="196" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ON TRACK</text>
    </g>

    <g transform="translate(260, 40)">
      <rect width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
      <rect x="20" y="24" width="140" height="28" rx="8" fill="#451a03" stroke="#f59e0b"/>
      <text x="90" y="43" fill="#fcd34d" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">31–60 DAYS</text>
      <text x="90" y="110" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$3,800</text>
      <text x="90" y="140" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">2 Invoices</text>
      <rect x="30" y="180" width="120" height="24" rx="12" fill="#451a03"/>
      <text x="90" y="196" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REMIND NOW</text>
    </g>

    <g transform="translate(480, 40)">
      <rect width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#ea580c" stroke-width="2"/>
      <rect x="20" y="24" width="140" height="28" rx="8" fill="#431407" stroke="#ea580c"/>
      <text x="90" y="43" fill="#fdba74" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">61–90 DAYS</text>
      <text x="90" y="110" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$1,200</text>
      <text x="90" y="140" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1 Invoice</text>
      <rect x="30" y="180" width="120" height="24" rx="12" fill="#431407"/>
      <text x="90" y="196" fill="#fb923c" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CALL CLIENT</text>
    </g>

    <g transform="translate(700, 40)">
      <rect width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
      <rect x="20" y="24" width="140" height="28" rx="8" fill="#450a0a" stroke="#ef4444"/>
      <text x="90" y="43" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">90+ DAYS</text>
      <text x="90" y="110" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$750</text>
      <text x="90" y="140" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">1 Invoice</text>
      <rect x="30" y="180" width="120" height="24" rx="12" fill="#450a0a"/>
      <text x="90" y="196" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PAUSE WORK</text>
    </g>
  </g>

</svg>