<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#09090b"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <g transform="translate(180, 110)">
    <!-- Checklist card -->
    <rect x="40" y="40" width="400" height="300" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="65" y="65" width="220" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="175" y="86" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">BILLING SETUP CHECKLIST</text>
    
    <g transform="translate(65, 120)">
      <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <path d="M7 12 L11 16 L17 9" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="35" y="16" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">Legal entity & VAT / Tax ID</text>
    </g>
    <g transform="translate(65, 165)">
      <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <path d="M7 12 L11 16 L17 9" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="35" y="16" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">Accounts payable contact email</text>
    </g>
    <g transform="translate(65, 210)">
      <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <path d="M7 12 L11 16 L17 9" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="35" y="16" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">Purchase order (PO) requirement</text>
    </g>
    <g transform="translate(65, 255)">
      <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <path d="M7 12 L11 16 L17 9" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="35" y="16" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="13">Payment run cycle & agreed terms</text>
    </g>

    <!-- Arrow & Result Badge -->
    <g transform="translate(480, 110)">
      <rect width="320" height="180" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
      <circle cx="160" cy="65" r="28" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
      <path d="M148 65 L157 74 L173 57" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
      <text x="160" y="125" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FIRST INVOICE CLEARED</text>
      <text x="160" y="150" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">No queries, paid on agreed date</text>
    </g>
  </g>

</svg>